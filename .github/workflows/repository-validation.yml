name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/check_repository.py

  domain-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/PKHeXMobile.Domain/PKHeXMobile.Domain.csproj --configuration Release
      - run: dotnet run --project tests/PKHeXMobile.Domain.Smoke/PKHeXMobile.Domain.Smoke.csproj --configuration Release
      - run: dotnet run --project tests/PKHeXMobile.ReadOnly.Smoke/PKHeXMobile.ReadOnly.Smoke.csproj --configuration Release
      - run: dotnet run --project src/PKHeXMobile.Inspect/PKHeXMobile.Inspect.csproj --configuration Release -- --help
      - run: dotnet run --project src/PKHeXMobile.Verify/PKHeXMobile.Verify.csproj --configuration Release -- --help
