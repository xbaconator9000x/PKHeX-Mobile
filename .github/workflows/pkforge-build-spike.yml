name: PKForge pinned Android build spike

# One bounded upstream build experiment, not a production dependency or release.
# No APK/artwork is uploaded or distributed. GitHub Actions minutes are finite.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pkforge-build-spike.yml'

permissions:
  contents: read

concurrency:
  group: pkforge-spike-build
  cancel-in-progress: true

jobs:
  pinned-upstream-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch immutable PKForge and exact gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet /tmp/pkforge
          cd /tmp/pkforge
          git remote add origin https://github.com/sofianeelhor/PKForge.git
          git fetch --depth=1 origin 2df04430e532b78c247f45b936f3068d8f824987
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "2df04430e532b78c247f45b936f3068d8f824987"
          test "$(git rev-parse HEAD:external/PKHeX)" = "91e9c88667a6a191a000db68e2db19505eb87561"
          test "$(git rev-parse HEAD:external/PKHeX-Plugins)" = "23ab1fc73f7be6ad427fbc900f9b99111cd2d560"
          git submodule update --init --recursive --depth=1
          test "$(git -C external/PKHeX rev-parse HEAD)" = "91e9c88667a6a191a000db68e2db19505eb87561"
          test "$(git -C external/PKHeX-Plugins rev-parse HEAD)" = "23ab1fc73f7be6ad427fbc900f9b99111cd2d560"
          echo "Exact PKForge source and fork/plugin gitlinks verified."
      - name: Record toolchain
        run: |
          dotnet --info
          dotnet workload list
          java -version
      - name: Install Android MAUI workload for upstream build
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Compile upstream Android app without publishing assets
        working-directory: /tmp/pkforge
        run: |
          dotnet build src/PKForge.App/PKForge.App.csproj \
            --framework net10.0-android --configuration Debug \
            -p:DiagnosticBuild=true -p:AndroidPackageFormat=apk \
            -v:minimal
      - name: Note certification limits
        if: always()
        run: |
          echo "Build spike only. No Android device run, save-write certification,"
          echo "fork-to-official-Core swap, third-party asset redistribution or APK release."
