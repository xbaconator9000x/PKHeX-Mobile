name: PKForge official Core compatibility probe

# One bounded diagnostic on explicit changes or manual dispatch only.
# Does not distribute upstream art, APKs, ROMs, or private save data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pkforge-official-core-probe.yml'
      - 'scripts/pkforge_official_core_probe.py'
      - 'tests/test_pkforge_official_core_probe.py'
      - 'scripts/pkforge_retail_only_probe.py'
      - 'tests/test_pkforge_retail_only_probe.py'
      - 'tests/PKHeXMobile.RetailProbe.Smoke/**'
      - 'src/PKHeXMobile.PortConsolidation/**'
      - 'tests/PKHeXMobile.RetailEditor.Smoke/**'
      - 'scripts/pkforge_detached_preview_ui.py'
      - 'tests/test_pkforge_detached_preview_ui.py'
      - 'scripts/pkforge_readonly_containment.py'
      - 'tests/test_pkforge_readonly_containment.py'
      - 'scripts/pkforge_preview_only_hardening.py'
      - 'tests/test_pkforge_preview_only_hardening.py'
      - 'tests/PKHeXMobile.Containment.Smoke/**'
      - 'scripts/pkforge_source_read_hardening.py'
      - 'tests/test_pkforge_source_read_hardening.py'
      - 'tests/PKHeXMobile.BoundedSource.Smoke/**'
      - 'scripts/pkforge_picker_lifecycle.py'
      - 'tests/test_pkforge_picker_lifecycle.py'
      - 'scripts/pkforge_folder_readonly.py'
      - 'tests/test_pkforge_folder_readonly.py'
      - 'tests/PKHeXMobile.FolderContainment.Smoke/**'
      - 'scripts/pkforge_provider_origin_binding.py'
      - 'tests/test_pkforge_provider_origin_binding.py'
      - 'tests/PKHeXMobile.ProviderBoundPreview.Smoke/**'
      - 'tests/PKHeXMobile.ProviderOriginLifecycle.Smoke/**'
      - 'scripts/pkforge_session_transaction.py'
      - 'tests/test_pkforge_session_transaction.py'
      - 'scripts/pkforge_disable_bulk_import.py'
      - 'tests/test_pkforge_disable_bulk_import.py'
      - 'scripts/pkforge_artifact_attestation.py'
      - 'scripts/pkforge_emulator_apk_selection.py'
      - 'scripts/pkforge_apk_signature_gate.py'
      - 'scripts/pkforge_emulator_launch_smoke.sh'
      - 'scripts/pkforge_emulator_picker_cancel.py'
      - 'tests/test_pkforge_emulator_picker_cancel.py'
      - 'scripts/pkforge_emulator_foreground.py'
      - 'tests/test_pkforge_emulator_launch_smoke.py'
      - 'tests/test_pkforge_emulator_apk_selection.py'
      - 'tests/test_pkforge_apk_signature_gate.py'
      - 'tests/test_pkforge_artifact_attestation.py'
      - 'scripts/pkforge_offline_preview.py'
      - 'tests/test_pkforge_offline_preview.py'
      - 'scripts/pkforge_neutral_assets.py'
      - 'tests/test_pkforge_neutral_assets.py'
      - 'scripts/pkforge_export_backup_boundary.py'
      - 'tests/test_pkforge_export_backup_boundary.py'
      - 'scripts/pkforge_backup_manifest_gate.py'
      - 'tests/test_pkforge_backup_manifest_gate.py'
      - 'scripts/pkforge_private_storage_refusal.py'
      - 'tests/test_pkforge_private_storage_refusal.py'
      - 'tests/PKHeXMobile.PrivateStorage.Smoke/**'
      - 'src/PKHeXMobile.Domain/**'
      - 'src/PKHeXMobile.ReadOnly/**'
      - 'scripts/pkforge_residual_cache_refusal.py'
      - 'tests/test_pkforge_ci_trigger_coverage.py'
      - 'THIRD_PARTY.md'
  pull_request:
    paths:
      - '.github/workflows/pkforge-official-core-probe.yml'
      - 'scripts/pkforge_official_core_probe.py'
      - 'tests/test_pkforge_official_core_probe.py'
      - 'scripts/pkforge_retail_only_probe.py'
      - 'tests/test_pkforge_retail_only_probe.py'
      - 'tests/PKHeXMobile.RetailProbe.Smoke/**'
      - 'src/PKHeXMobile.PortConsolidation/**'
      - 'tests/PKHeXMobile.RetailEditor.Smoke/**'
      - 'scripts/pkforge_detached_preview_ui.py'
      - 'tests/test_pkforge_detached_preview_ui.py'
      - 'scripts/pkforge_readonly_containment.py'
      - 'tests/test_pkforge_readonly_containment.py'
      - 'scripts/pkforge_preview_only_hardening.py'
      - 'tests/test_pkforge_preview_only_hardening.py'
      - 'tests/PKHeXMobile.Containment.Smoke/**'
      - 'scripts/pkforge_source_read_hardening.py'
      - 'tests/test_pkforge_source_read_hardening.py'
      - 'tests/PKHeXMobile.BoundedSource.Smoke/**'
      - 'scripts/pkforge_picker_lifecycle.py'
      - 'tests/test_pkforge_picker_lifecycle.py'
      - 'scripts/pkforge_folder_readonly.py'
      - 'tests/test_pkforge_folder_readonly.py'
      - 'tests/PKHeXMobile.FolderContainment.Smoke/**'
      - 'scripts/pkforge_provider_origin_binding.py'
      - 'tests/test_pkforge_provider_origin_binding.py'
      - 'tests/PKHeXMobile.ProviderBoundPreview.Smoke/**'
      - 'tests/PKHeXMobile.ProviderOriginLifecycle.Smoke/**'
      - 'scripts/pkforge_session_transaction.py'
      - 'tests/test_pkforge_session_transaction.py'
      - 'scripts/pkforge_disable_bulk_import.py'
      - 'tests/test_pkforge_disable_bulk_import.py'
      - 'scripts/pkforge_artifact_attestation.py'
      - 'scripts/pkforge_emulator_apk_selection.py'
      - 'scripts/pkforge_apk_signature_gate.py'
      - 'scripts/pkforge_emulator_launch_smoke.sh'
      - 'scripts/pkforge_emulator_picker_cancel.py'
      - 'tests/test_pkforge_emulator_picker_cancel.py'
      - 'scripts/pkforge_emulator_foreground.py'
      - 'tests/test_pkforge_emulator_launch_smoke.py'
      - 'tests/test_pkforge_emulator_apk_selection.py'
      - 'tests/test_pkforge_apk_signature_gate.py'
      - 'tests/test_pkforge_artifact_attestation.py'
      - 'scripts/pkforge_offline_preview.py'
      - 'tests/test_pkforge_offline_preview.py'
      - 'scripts/pkforge_neutral_assets.py'
      - 'tests/test_pkforge_neutral_assets.py'
      - 'scripts/pkforge_export_backup_boundary.py'
      - 'tests/test_pkforge_export_backup_boundary.py'
      - 'scripts/pkforge_backup_manifest_gate.py'
      - 'tests/test_pkforge_backup_manifest_gate.py'
      - 'scripts/pkforge_private_storage_refusal.py'
      - 'tests/test_pkforge_private_storage_refusal.py'
      - 'tests/PKHeXMobile.PrivateStorage.Smoke/**'
      - 'src/PKHeXMobile.Domain/**'
      - 'src/PKHeXMobile.ReadOnly/**'
      - 'scripts/pkforge_residual_cache_refusal.py'
      - 'tests/test_pkforge_ci_trigger_coverage.py'
      - 'THIRD_PARTY.md'

permissions:
  contents: read
concurrency:
  group: official-core-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate safe project-reference substitution
        run: |
          python3 -m unittest discover -s tests -p 'test_pkforge_official_core_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_retail_only_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_detached_preview_ui.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_readonly_containment.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_preview_only_hardening.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_source_read_hardening.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_picker_lifecycle.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_folder_readonly.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_provider_origin_binding.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_session_transaction.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_disable_bulk_import.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_artifact_attestation.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_emulator_apk_selection.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_apk_signature_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_emulator_launch_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_emulator_picker_cancel.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_offline_preview.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_neutral_assets.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_export_backup_boundary.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_backup_manifest_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_pkforge_private_storage_refusal.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch pinned PKForge with exact gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet /tmp/pkforge
          cd /tmp/pkforge
          git remote add origin https://github.com/sofianeelhor/PKForge.git
          git fetch --depth=1 origin 2df04430e532b78c247f45b936f3068d8f824987
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD:external/PKHeX)" = "91e9c88667a6a191a000db68e2db19505eb87561"
          test "$(git rev-parse HEAD:external/PKHeX-Plugins)" = "23ab1fc73f7be6ad427fbc900f9b99111cd2d560"
          git submodule update --init --recursive --depth=1
      - name: Adapt pinned fork references and AutoMod Seed64 API for official Core
        run: python3 scripts/pkforge_official_core_probe.py --repo /tmp/pkforge
      - name: Isolate fork-only handlers in temporary retail-only checkout
        run: python3 -m scripts.pkforge_retail_only_probe --repo /tmp/pkforge
      - name: Build portable PKForge engine against official Core
        id: engine
        continue-on-error: true
        working-directory: /tmp/pkforge
        run: dotnet build src/PKForge.Engine/PKForge.Engine.csproj -c Release -v:minimal
      - name: Exercise retail-only runtime refusals against official Core
        id: retail-smoke
        if: steps.engine.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.RetailProbe.Smoke/PKHeXMobile.RetailProbe.Smoke.csproj --configuration Release
      - name: Exercise detached PKForge editor against official Core synthetic save
        id: retail-editor
        if: steps.engine.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.RetailEditor.Smoke/PKHeXMobile.RetailEditor.Smoke.csproj --configuration Release
      - name: Wire detached preview into pinned MAUI editor (temporary checkout only)
        id: preview-ui
        if: steps.engine.outcome == 'success' && steps.retail-smoke.outcome == 'success' && steps.retail-editor.outcome == 'success'
        run: python3 -m scripts.pkforge_detached_preview_ui --repo /tmp/pkforge --mobile "$GITHUB_WORKSPACE"
      - name: Install read-only writer and provider containment
        id: containment
        if: steps.preview-ui.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_readonly_containment --repo /tmp/pkforge
      - name: Enforce read-only picker grants and block live-session mutation
        id: hardening
        if: steps.containment.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_preview_only_hardening --repo /tmp/pkforge
      - name: Harden single-picker cancellation and read-once grants
        id: picker-lifecycle
        if: steps.hardening.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_picker_lifecycle --repo /tmp/pkforge
      - name: Disable unbounded PKSM multi-import and Android multi-picker
        id: bulk-import-refusal
        if: steps.picker-lifecycle.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_disable_bulk_import --repo /tmp/pkforge
      - name: Exercise denied writer and provider-spy paths
        id: containment-smoke
        if: steps.hardening.outcome == 'success' && steps.picker-lifecycle.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.Containment.Smoke/PKHeXMobile.Containment.Smoke.csproj --configuration Release
      - name: Install bounded two-open source adapter
        id: bounded-source
        if: steps.containment-smoke.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_source_read_hardening --repo /tmp/pkforge
      - name: Exercise bounded source provider-race tests
        id: bounded-smoke
        if: steps.bounded-source.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.BoundedSource.Smoke/PKHeXMobile.BoundedSource.Smoke.csproj --configuration Release
      - name: Deny independent folder export routes and bound folder imports
        id: folder-containment
        if: steps.bounded-smoke.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_folder_readonly --repo /tmp/pkforge
      - name: Exercise folder provider-spy refusal tests
        id: folder-smoke
        if: steps.folder-containment.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.FolderContainment.Smoke/PKHeXMobile.FolderContainment.Smoke.csproj --configuration Release
      - name: Bind immutable provider-origin baseline to PKForge session
        id: provider-origin
        if: steps.folder-smoke.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_provider_origin_binding --repo /tmp/pkforge --mobile "$GITHUB_WORKSPACE"
      - name: Install atomic session activation and lifecycle invalidation
        id: session-transaction
        if: steps.provider-origin.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_session_transaction --repo /tmp/pkforge
      - name: Exercise provider-bound preview and session-race refusals
        id: provider-preview-smoke
        if: steps.session-transaction.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.ProviderBoundPreview.Smoke/PKHeXMobile.ProviderBoundPreview.Smoke.csproj --configuration Release
      - name: Exercise real PKForge session lifecycle and overlapping-open rejection
        id: provider-lifecycle-smoke
        if: steps.provider-preview-smoke.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: dotnet run --project tests/PKHeXMobile.ProviderOriginLifecycle.Smoke/PKHeXMobile.ProviderOriginLifecycle.Smoke.csproj --configuration Release
      - name: Disable runtime media downloads and APK installation in diagnostic MAUI
        id: offline-containment
        if: steps.provider-lifecycle-smoke.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_offline_preview --repo /tmp/pkforge
      - name: Remove unreviewed media and fonts; deny persistent game-art cache
        id: neutral-assets
        if: steps.offline-containment.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_neutral_assets --repo /tmp/pkforge
      - name: Deny whole-save sharing and Android cloud/device backups in preview
        id: export-backup-boundary
        if: steps.neutral-assets.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_export_backup_boundary --repo /tmp/pkforge
      - name: Deny private bank and raw-save backup writes in diagnostic Infrastructure
        id: private-storage
        if: steps.export-backup-boundary.outcome == 'success'
        continue-on-error: true
        run: python3 -m scripts.pkforge_private_storage_refusal --repo /tmp/pkforge
      - name: Execute diagnostic private-storage refusal against adapted Infrastructure
        id: private-storage-smoke
        if: steps.private-storage.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        run: |
          dotnet build tests/PKHeXMobile.PrivateStorage.Smoke/PKHeXMobile.PrivateStorage.Smoke.csproj -c Release -p:DiagnosticBuild=true -v:minimal
          dotnet tests/PKHeXMobile.PrivateStorage.Smoke/bin/Release/net10.0/PKHeXMobile.PrivateStorage.Smoke.dll
      - name: Install Android MAUI only after runtime refusal checks
        id: maui-workload
        if: steps.engine.outcome == 'success' && steps.retail-smoke.outcome == 'success' && steps.retail-editor.outcome == 'success' && steps.preview-ui.outcome == 'success' && steps.hardening.outcome == 'success' && steps.picker-lifecycle.outcome == 'success' && steps.bulk-import-refusal.outcome == 'success' && steps.containment-smoke.outcome == 'success' && steps.bounded-source.outcome == 'success' && steps.bounded-smoke.outcome == 'success' && steps.folder-containment.outcome == 'success' && steps.folder-smoke.outcome == 'success' && steps.provider-origin.outcome == 'success' && steps.session-transaction.outcome == 'success' && steps.provider-preview-smoke.outcome == 'success' && steps.provider-lifecycle-smoke.outcome == 'success' && steps.offline-containment.outcome == 'success' && steps.neutral-assets.outcome == 'success' && steps.export-backup-boundary.outcome == 'success' && steps.private-storage-smoke.outcome == 'success'
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore exact diagnostic Android dependency graph before input freeze
        id: android-restore
        if: steps.maui-workload.outcome == 'success'
        env:
          PKForgeRoot: /tmp/pkforge
        working-directory: /tmp/pkforge
        run: |
          dotnet restore src/PKForge.App/PKForge.App.csproj \
            -p:DiagnosticBuild=true -p:AndroidPackageFormat=apk -v:minimal
      - name: Freeze complete transformed inputs, external sources and media
        id: source-freeze
        if: steps.android-restore.outcome == 'success'
        run: |
          python3 scripts/pkforge_artifact_attestation.py \
            --repo /tmp/pkforge --mobile "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/pkforge-source-freeze.json" --snapshot-only
      - name: Build PKForge Android against official Core
        id: android
        if: steps.engine.outcome == 'success' && steps.retail-smoke.outcome == 'success' && steps.retail-editor.outcome == 'success' && steps.preview-ui.outcome == 'success' && steps.hardening.outcome == 'success' && steps.picker-lifecycle.outcome == 'success' && steps.bulk-import-refusal.outcome == 'success' && steps.containment-smoke.outcome == 'success' && steps.bounded-source.outcome == 'success' && steps.bounded-smoke.outcome == 'success' && steps.folder-containment.outcome == 'success' && steps.folder-smoke.outcome == 'success' && steps.provider-origin.outcome == 'success' && steps.session-transaction.outcome == 'success' && steps.provider-preview-smoke.outcome == 'success' && steps.provider-lifecycle-smoke.outcome == 'success' && steps.offline-containment.outcome == 'success' && steps.neutral-assets.outcome == 'success' && steps.export-backup-boundary.outcome == 'success' && steps.private-storage-smoke.outcome == 'success' && steps.source-freeze.outcome == 'success'
        continue-on-error: true
        env:
          PKForgeRoot: /tmp/pkforge
        working-directory: /tmp/pkforge
        run: |
          dotnet build src/PKForge.App/PKForge.App.csproj -f net10.0-android -c Debug --no-restore \
            -p:DiagnosticBuild=true -p:AndroidPackageFormat=apk -v:minimal
      - name: Verify compiled APK denies network and package installation permissions
        id: offline-apk-permissions
        if: steps.android.outcome == 'success'
        run: python3 -m scripts.pkforge_offline_preview --repo /tmp/pkforge --verify-apks
      - name: Verify compiled Android cloud and D2D backup exclusions
        id: backup-apk-manifest
        if: steps.offline-apk-permissions.outcome == 'success'
        run: python3 -m scripts.pkforge_backup_manifest_gate --repo /tmp/pkforge
      - name: Reject unresolved fonts, game art and audio in compiled APK
        id: neutral-apk-media
        if: steps.backup-apk-manifest.outcome == 'success'
        run: python3 -m scripts.pkforge_neutral_assets --repo /tmp/pkforge --verify-apks
      - name: Attest adapted editor APK identity and inventory bundled media
        id: apk-provenance
        if: steps.android.outcome == 'success' && steps.offline-apk-permissions.outcome == 'success' && steps.backup-apk-manifest.outcome == 'success' && steps.neutral-apk-media.outcome == 'success'
        shell: bash
        run: |
          python3 scripts/pkforge_artifact_attestation.py \
            --repo /tmp/pkforge --mobile "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/pkforge-diagnostic-provenance.json" \
            --source-snapshot "$RUNNER_TEMP/pkforge-source-freeze.json"
          echo 'APK identity verified; upstream artwork redistribution NOT authorized.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require exact attested APK Android cryptographic signer
        id: apk-signer
        if: steps.apk-provenance.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner" && test -x "$apksigner"
          python3 scripts/pkforge_emulator_apk_selection.py \
            --provenance "$RUNNER_TEMP/pkforge-diagnostic-provenance.json" \
            --build-dir /tmp/pkforge/src/PKForge.App/bin/Debug/net10.0-android \
            --source-snapshot "$RUNNER_TEMP/pkforge-source-freeze.json" \
            --expected-mobile-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/pkforge-selected-apk.json"
          python3 scripts/pkforge_apk_signature_gate.py \
            --provenance "$RUNNER_TEMP/pkforge-diagnostic-provenance.json" \
            --selection "$RUNNER_TEMP/pkforge-selected-apk.json" \
            --build-dir /tmp/pkforge/src/PKForge.App/bin/Debug/net10.0-android \
            --source-snapshot "$RUNNER_TEMP/pkforge-source-freeze.json" \
            --expected-mobile-sha "$GITHUB_SHA" --apksigner "$apksigner"
          echo 'Exact diagnostic APK signer verified; debug signer is NOT release authorization.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM for ephemeral Android emulator
        id: kvm
        if: steps.apk-signer.outcome == 'success'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install attested signed APK and prove foreground Activity in emulator
        id: emulator-smoke
        if: steps.kvm.outcome == 'success' && steps.apk-signer.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/pkforge_emulator_launch_smoke.sh /tmp/pkforge
      - name: Retain provenance metadata only (NEVER upload the APK)
        if: steps.apk-provenance.outcome == 'success' && steps.apk-signer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pkforge-adapted-editor-provenance-only
          path: ${{ runner.temp }}/pkforge-diagnostic-provenance.json
          if-no-files-found: error
          retention-days: 3
      - name: Record explicit compatibility verdict
        if: always()
        env:
          ENGINE: ${{ steps.engine.outcome }}
          RETAIL_SMOKE: ${{ steps.retail-smoke.outcome }}
          RETAIL_EDITOR: ${{ steps.retail-editor.outcome }}
          PREVIEW_UI: ${{ steps.preview-ui.outcome }}
          CONTAINMENT: ${{ steps.containment.outcome }}
          HARDENING: ${{ steps.hardening.outcome }}
          PICKER_LIFECYCLE: ${{ steps.picker-lifecycle.outcome }}
          BULK_IMPORT_REFUSAL: ${{ steps.bulk-import-refusal.outcome }}
          CONTAINMENT_SMOKE: ${{ steps.containment-smoke.outcome }}
