name: Android read-only prototype build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/PKHeXMobile.Android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'src/PKHeXMobile.Android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Build Android prototype (debug; no release claim)
        run: dotnet build src/PKHeXMobile.Android/PKHeXMobile.Android.csproj -c Debug -p:AndroidPackageFormat=apk
      - name: Preserve debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: pkhexmobile-readonly-debug-apk
          path: src/PKHeXMobile.Android/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 7
